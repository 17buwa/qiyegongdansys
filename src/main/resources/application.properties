spring.application.name=qiyegongdan

# MySQL 数据源
spring.datasource.url=jdbc:mysql://localhost:3306/qiyegongdan?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# JWT 配置
jwt.secret=qiyegongdan-jwt-secret-key-please-change-in-production-0123456789
jwt.expiration=86400000

# 附件上传本地磁盘路径
file.upload-dir=./uploads

# 服务器端口
server.port=8080

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# 临时调试：开启 Spring Security 调试日志
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.aop=DEBUG